version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: oficina_postgres_db
    environment:
      POSTGRES_USER: oficina_user
      POSTGRES_PASSWORD: OficinaPassword@2026
      POSTGRES_DB: oficina_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina_user -d oficina_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: oficina_backend_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Sistema Integrado de Gestão de Oficina Mecânica - FIAP SOAT
      - VERSION=1.0.0
      - API_V1_STR=/api/v1
      - DATABASE_URL=postgresql://oficina_user:OficinaPassword@2026@db:5432/oficina_db
      - SECRET_KEY=chave-secreta-producao-soat-fiap-2026
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=AdminPassword@2026
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: